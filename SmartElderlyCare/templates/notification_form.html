
<!DOCTYPE html>
<html>
<head>
    <title>Create Notification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4>Create New Notification</h4>
        </div>

        <div class="card-body">

            <form method="POST" action="/notifications/add">

                <div class="mb-3">
                    <label class="form-label">Select Elderly Person</label>

                    <select name="elderly_id" class="form-select" required>
                        <option value="">Choose Person</option>

                        {% for person in elderly_list %}
                        <option value="{{ person.elderly_id }}">
                            {{ person.full_name }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Notification Title</label>
                    <input type="text" name="title"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea name="message"
                              class="form-control"
                              rows="4" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Notification Type</label>

                    <select name="notification_type"
                            class="form-select" required>
                        <option value="General">General</option>
                        <option value="Health">Health Alert</option>
                        <option value="Medication">Medication Reminder</option>
                        <option value="Visit">Visit Update</option>
                        <option value="Emergency">Emergency</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Save Notification
                </button>

                <a href="/notifications" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
