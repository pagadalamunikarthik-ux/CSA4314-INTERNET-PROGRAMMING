
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Record Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f7fb;">

<div class="container mt-5">
    <div class="card shadow-sm p-4 mx-auto" style="max-width:750px;">

        <h2>{% if record %}Edit Health Record{% else %}Add Health Record{% endif %}</h2>
        <p class="text-muted">Enter readings measured during the care visit.</p>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Elderly Person</label>
                <select name="elderly_id" class="form-select" required>
                    <option value="">Select elderly person</option>
                    {% for person in elderly_list %}
                    <option value="{{ person[0] }}"
                        {% if record and record[1] == person[0] %}selected{% endif %}>
                        {{ person[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Caregiver Who Recorded This (optional)</label>
                <select name="caregiver_id" class="form-select">
                    <option value="">Not specified</option>
                    {% for caregiver in caregiver_list %}
                    <option value="{{ caregiver[0] }}"
                        {% if record and record[2] %}
                            {% for person in caregiver_list %}
                                {% if person[0] == caregiver[0] and record[2] == person[0] %}selected{% endif %}
                            {% endfor %}
                        {% endif %}>
                        {{ caregiver[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Blood Pressure (e.g. 120/80)</label>
                <input type="text" name="blood_pressure" class="form-control"
                       value="{{ record[3] if record else '' }}"
                       placeholder="Systolic/Diastolic">
            </div>

            <div class="mb-3">
                <label class="form-label">Heart Rate (bpm)</label>
                <input type="number" name="heart_rate" class="form-control"
                       value="{{ record[4] if record else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Temperature (°C)</label>
                <input type="number" step="0.1" name="temperature" class="form-control"
                       value="{{ record[5] if record else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Oxygen Level (SpO₂ %)</label>
                <input type="number" name="oxygen_level" min="0" max="100"
                       class="form-control"
                       value="{{ record[6] if record else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Observations / Notes</label>
                <textarea name="notes" class="form-control" rows="3">{{ record[7] if record else '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                {% if record %}Update Record{% else %}Save Health Record{% endif %}
            </button>

            <a href="/health" class="btn btn-secondary">Cancel</a>

        </form>
    </div>
</div>
</body>
</html>
