
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Elderly Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .form-card {
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .family-card {
            background: #f8faff;
            border: 1px solid #dee5ef;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="form-card">

        <h2>Add Elderly Profile</h2>
        <p class="text-muted">Enter personal, medical and family information.</p>

        <form method="POST" action="/elderly/add">

            <h5 class="mb-3">Personal Information</h5>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control"
                       placeholder="Enter full name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" name="age" class="form-control"
                       min="1" max="120" placeholder="Enter age">
            </div>

            <div class="mb-3">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-select">
                    <option value="">Select gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control"
                          rows="3" placeholder="Enter address"></textarea>
            </div>

            <hr>

            <h5 class="mb-3">Medical Information</h5>

            <div class="mb-3">
                <label class="form-label">Medical Conditions</label>
                <textarea name="medical_conditions" class="form-control"
                          rows="3" placeholder="Enter known medical conditions"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Emergency Contact Number</label>
                <input type="tel" name="emergency_contact" class="form-control"
                       placeholder="Enter contact number">
            </div>

            <hr>

            <h5>Family Members / Emergency Contacts</h5>
            <p class="text-muted">Add one or more family members.</p>

            <div id="familyContainer">

                <div class="family-card">

                    <div class="d-flex justify-content-between">
                        <h6>Family Member 1</h6>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="family_name[]"
                               class="form-control"
                               placeholder="Enter family member name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Relationship</label>
                        <select name="relationship[]" class="form-select">
                            <option value="">Select relationship</option>
                            <option>Son</option>
                            <option>Daughter</option>
                            <option>Wife</option>
                            <option>Husband</option>
                            <option>Brother</option>
                            <option>Sister</option>
                            <option>Grandson</option>
                            <option>Granddaughter</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" name="family_phone[]"
                               class="form-control"
                               placeholder="Enter phone number">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="family_email[]"
                               class="form-control"
                               placeholder="Enter email address">
                    </div>

                    <div class="form-check">
                        <input type="radio" name="primary_family"
                               value="0" class="form-check-input" checked>
                        <label class="form-check-label">
                            Primary family contact
                        </label>
                    </div>

                </div>

            </div>

            <button type="button" class="btn btn-outline-primary mb-4"
                    onclick="addFamilyMember()">
                + Add Another Family Member
            </button>

            <hr>

            <button type="submit" class="btn btn-primary">
                Save Profile
            </button>

            <a href="/" class="btn btn-secondary ms-2">Cancel</a>

        </form>
    </div>
</div>

<script>
    let familyCount = 1;

    function addFamilyMember() {
        const container = document.getElementById("familyContainer");
        const index = familyCount;

        const card = document.createElement("div");
        card.className = "family-card";

        card.innerHTML = `
            <div class="d-flex justify-content-between mb-3">
                <h6>Family Member ${index + 1}</h6>
                <button type="button" class="btn btn-sm btn-danger"
                        onclick="this.closest('.family-card').remove()">
                    Remove
                </button>
            </div>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="family_name[]" class="form-control"
                       placeholder="Enter family member name">
            </div>

            <div class="mb-3">
                <label class="form-label">Relationship</label>
                <select name="relationship[]" class="form-select">
                    <option value="">Select relationship</option>
                    <option>Son</option>
                    <option>Daughter</option>
                    <option>Wife</option>
                    <option>Husband</option>
                    <option>Brother</option>
                    <option>Sister</option>
                    <option>Grandson</option>
                    <option>Granddaughter</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="family_phone[]" class="form-control"
                       placeholder="Enter phone number">
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="family_email[]" class="form-control"
                       placeholder="Enter email address">
            </div>

            <div class="form-check">
                <input type="radio" name="primary_family"
                       value="${index}" class="form-check-input">
                <label class="form-check-label">
                    Primary family contact
                </label>
            </div>
        `;

        container.appendChild(card);
        familyCount++;
    }
</script>

</body>
</html>
