
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Elderly Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f7fb;">

<div class="container mt-5 mb-5">
<div class="card shadow-sm p-4 mx-auto" style="max-width:850px;">

<h2>Edit Elderly Profile</h2>
<p class="text-muted">Update personal and family information.</p>

<form method="POST">
    <h4 class="mt-3">Personal Information</h4>

    <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" value="{{ person[1] }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Age</label>
        <input type="number" name="age" class="form-control" value="{{ person[2] or '' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Gender</label>
        <select name="gender" class="form-select">
            <option value="">Select gender</option>
            <option value="Male" {% if person[3] == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if person[3] == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if person[3] == 'Other' %}selected{% endif %}>Other</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea name="address" class="form-control" rows="3">{{ person[4] or '' }}</textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Medical Conditions</label>
        <textarea name="medical_conditions" class="form-control" rows="3">{{ person[5] or '' }}</textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Emergency Contact</label>
        <input type="text" name="emergency_contact" class="form-control" value="{{ person[6] or '' }}">
    </div>

    <button type="submit" class="btn btn-primary">Update Profile</button>
</form>

<hr>

<h4>Existing Family Members</h4>

{% if family_members %}
    {% for member in family_members %}
    <div class="card p-3 mb-3 bg-light">
        <form method="POST" action="/family/edit/{{ member[0] }}">
            <div class="mb-2">
                <label class="form-label">Name</label>
                <input type="text" name="full_name" class="form-control" value="{{ member[2] }}" required>
            </div>

            <div class="mb-2">
                <label class="form-label">Relationship</label>
                <input type="text" name="relationship" class="form-control" value="{{ member[3] or '' }}">
            </div>

            <div class="mb-2">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ member[4] }}" required>
            </div>

            <div class="mb-2">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ member[5] or '' }}">
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" name="is_primary" value="1"
                       class="form-check-input" {% if member[6] %}checked{% endif %}>
                <label class="form-check-label">Primary Contact</label>
            </div>

            <button type="submit" class="btn btn-success btn-sm">Save Changes</button>
        </form>

        <form method="POST" action="/family/delete/{{ member[0] }}"
              onsubmit="return confirm('Are you sure you want to delete this family member?');"
              class="mt-2">
            <button type="submit" class="btn btn-danger btn-sm">Delete Family Member</button>
        </form>
    </div>
    {% endfor %}
{% else %}
    <p class="text-muted">No family members added yet.</p>
{% endif %}

<hr>

<h4>Add New Family Members</h4>

<form method="POST" action="/elderly/{{ person[0] }}/family/add">
    <div id="familyContainer">
        <div class="card p-3 mb-3 family-card">
            <div class="mb-2">
                <label class="form-label">Name</label>
                <input type="text" name="family_name[]" class="form-control">
            </div>

            <div class="mb-2">
                <label class="form-label">Relationship</label>
                <input type="text" name="relationship[]" class="form-control">
            </div>

            <div class="mb-2">
                <label class="form-label">Phone</label>
                <input type="text" name="family_phone[]" class="form-control">
            </div>

            <div class="mb-2">
                <label class="form-label">Email</label>
                <input type="email" name="family_email[]" class="form-control">
            </div>

            <div class="form-check">
                <input type="radio" name="primary_family" value="0" class="form-check-input">
                <label class="form-check-label">Primary Contact</label>
            </div>
        </div>
    </div>

    <button type="button" class="btn btn-outline-success mb-3" onclick="addFamilyMember()">
        + Add Another Family Member
    </button>

    <div>
        <button type="submit" class="btn btn-success">Save New Family Members</button>
        <a href="/elderly" class="btn btn-secondary">Back</a>
    </div>
</form>

</div>
</div>

<script>
let familyCount = 1;

function addFamilyMember() {
    const container = document.getElementById("familyContainer");
    const card = document.createElement("div");

    card.className = "card p-3 mb-3 family-card";

    card.innerHTML = `
        <div class="mb-2">
            <label class="form-label">Name</label>
            <input type="text" name="family_name[]" class="form-control">
        </div>

        <div class="mb-2">
            <label class="form-label">Relationship</label>
            <input type="text" name="relationship[]" class="form-control">
        </div>

        <div class="mb-2">
            <label class="form-label">Phone</label>
            <input type="text" name="family_phone[]" class="form-control">
        </div>

        <div class="mb-2">
            <label class="form-label">Email</label>
            <input type="email" name="family_email[]" class="form-control">
        </div>

        <div class="form-check mb-2">
            <input type="radio" name="primary_family"
                   value="${familyCount}" class="form-check-input">
            <label class="form-check-label">Primary Contact</label>
        </div>

        <button type="button" class="btn btn-danger btn-sm"
                onclick="this.closest('.family-card').remove()">
            Remove
        </button>
    `;

    container.appendChild(card);
    familyCount++;
}
</script>

</body>
</html>
