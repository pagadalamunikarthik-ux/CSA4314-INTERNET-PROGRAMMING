
<!DOCTYPE html>
<html>
<head>
    <title>Caregiver Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            padding: 30px;
        }

        .form-box {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ddd;
        }
    </style>
</head>

<body>

<div class="form-box">

    <h2 class="mb-4">
        {% if caregiver %}
            Edit Caregiver
        {% else %}
            Register New Caregiver
        {% endif %}
    </h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text"
                   name="full_name"
                   class="form-control"
                   value="{{ caregiver[1] if caregiver else '' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email"
                   name="email"
                   class="form-control"
                   value="{{ caregiver[2] if caregiver else '' }}"
                   {% if caregiver %}readonly{% endif %}
                   required>
        </div>

        {% if not caregiver %}
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   minlength="6"
                   required>
        </div>
        {% endif %}

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text"
                   name="phone"
                   class="form-control"
                   value="{{ caregiver[3] if caregiver else '' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Specialization</label>
            <input type="text"
                   name="specialization"
                   class="form-control"
                   value="{{ caregiver[4] if caregiver else '' }}"
                   placeholder="Elderly Care, Nursing, First Aid">
        </div>

        <div class="mb-3">
            <label class="form-label">Availability</label>
            <select name="availability" class="form-select">
                <option value="Full Time"
                    {% if caregiver and caregiver[5] == 'Full Time' %}selected{% endif %}>
                    Full Time
                </option>

                <option value="Part Time"
                    {% if caregiver and caregiver[5] == 'Part Time' %}selected{% endif %}>
                    Part Time
                </option>

                <option value="Night Shift"
                    {% if caregiver and caregiver[5] == 'Night Shift' %}selected{% endif %}>
                    Night Shift
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            {% if caregiver %}Update Caregiver{% else %}Register Caregiver{% endif %}
        </button>

        <a href="/caregivers" class="btn btn-secondary w-100 mt-2">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
