
<!DOCTYPE html>
<html>
<head>
    <title>Report Emergency Incident</title>
</head>
<body>
    <h2>Report Emergency Incident</h2>

    <form action="/emergency-incidents/add" method="POST">

        <label>Select Elderly Person:</label>
        <select name="elderly_id" required>
            <option value="">Select Elderly Person</option>
            {% for person in elderly_list %}
            <option value="{{ person.elderly_id }}">
                {{ person.full_name }}
            </option>
            {% endfor %}
        </select>
        <br><br>

        <label>Incident Type:</label>
        <input type="text" name="incident_type" required>
        <br><br>

        <label>Severity:</label>
        <select name="severity" required>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
        </select>
        <br><br>

        <label>Description:</label>
        <textarea name="description" required></textarea>
        <br><br>

        <label>Action Taken:</label>
        <textarea name="action_taken"></textarea>
        <br><br>

        <button type="submit">Submit Incident</button>
    </form>
</body>
</html>
