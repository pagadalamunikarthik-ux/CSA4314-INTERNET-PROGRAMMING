
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medication Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f7fb;">

<div class="container mt-5">
    <div class="card shadow-sm p-4 mx-auto" style="max-width:750px;">

        <h2>
            {% if medication %}
                Edit Medication
            {% else %}
                Add New Medication
            {% endif %}
        </h2>

        <p class="text-muted">
            Enter the medicine details from the person's prescribed care plan.
        </p>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Select Elderly Person</label>

                <select name="elderly_id" class="form-select" required>
                    <option value="">Choose a person</option>

                    {% for person in elderly_list %}
                    <option value="{{ person[0] }}"
                        {% if medication and medication[1] == person[0] %}selected{% endif %}>
                        {{ person[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Medicine Name</label>
                <input type="text" name="medicine_name"
                       class="form-control"
                       value="{{ medication[2] if medication else '' }}"
                       placeholder="Enter medicine name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Dosage</label>
                <input type="text" name="dosage"
                       class="form-control"
                       value="{{ medication[3] if medication else '' }}"
                       placeholder="Enter prescribed dosage">
            </div>

            <div class="mb-3">
                <label class="form-label">Medicine Schedule</label>
                <select name="schedule" class="form-select" required>
                    <option value="">Select schedule</option>
                    <option value="Morning"
                        {% if medication and medication[4] == 'Morning' %}selected{% endif %}>
                        Morning
                    </option>
                    <option value="Afternoon"
                        {% if medication and medication[4] == 'Afternoon' %}selected{% endif %}>
                        Afternoon
                    </option>
                    <option value="Night"
                        {% if medication and medication[4] == 'Night' %}selected{% endif %}>
                        Night
                    </option>
                    <option value="Morning and Night"
                        {% if medication and medication[4] == 'Morning and Night' %}selected{% endif %}>
                        Morning and Night
                    </option>
                    <option value="As Prescribed"
                        {% if medication and medication[4] == 'As Prescribed' %}selected{% endif %}>
                        As Prescribed
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Instructions</label>
                <textarea name="instructions" class="form-control"
                          rows="3"
                          placeholder="Enter instructions from the care plan">{{ medication[5] if medication else '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                {% if medication %}Update Medication{% else %}Save Medication{% endif %}
            </button>

            <a href="/medications" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

</body>
</html>
